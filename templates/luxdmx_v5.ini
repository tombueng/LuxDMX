# LuxDMX v5 board — legacy alias. The v5 and v6 revisions share the same pin map, so
# this exists only so an older `-DDEFAULT_TEMPLATE=luxdmx_v5` source build (and anything
# that stored "luxdmx_v5") still resolves to real values instead of a neutral config.
# If the two ever diverge, copy luxdmx_v6.ini here and edit it, don't extend it.
extends=luxdmx_v6
