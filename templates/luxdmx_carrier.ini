# LuxDMX Carrier board (ESP32-S3 module + up to 3 RS-485 modules + W5500 on a passive
# carrier PCB, hardware-carrier/). Runtime default VALUES only; there is no dedicated
# build env, the released esp32s3dev / esp32s3_psram image runs it.
#
# Pin map read out of hardware-carrier/luxdmx-carrier.kicad_pcb, so these are the board's
# actual nets, not a guess. It used to name the 4-layer file; that variant is gone. A plane
# is not a conductor of a known width - the current crowds along the shortest path through
# it - so the supply runs as 4.8 mm tracks on two layers instead, which is a number that
# means something. The pin map was identical either way.
extends=_base

# Status LED OFF. The dev module's own WS2812 sits on IO48, which is pixel port 5 on this
# board, and two drivers on one pin is the one combination that actually breaks. With
# pixel port 5 unused you can turn the LED back on at ledpin=48 / ledtype=2.
ledtype=0
ledpin=-1

# Three DMX ports. Only port 1 is enabled by default: a freshly built board has no
# transceiver modules soldered yet, and an enabled output with no module is just noise.
o0_en=1
o0_uni=0
o0_tx=17
o0_rx=18
o0_rts=16
o1_en=0
o1_uni=1
o1_tx=15
o1_rx=7
o1_rts=6
o2_en=0
o2_uni=2
o2_tx=5
o2_rx=4
o2_rts=8

# W5500 module (opt-in at runtime; WiFi is the default)
ethcs=10
ethsck=12
ethmosi=11
ethmiso=13
ethint=14
ethrst=9

# Display header (1.3" I2C OLED; panel stays off until enabled)
dispsda=1
dispscl=2

# Rotary encoder, on the carrier itself: a bare EC11 with a push switch, which is the part
# inside a KY-040 module. The module's three 10k pullups buy nothing here, all three pins
# have their own. It used to be a 5-pin header at the board edge and that cost these three
# signals a trip right across the board; ENC_SW would not route at all.
enca=42
encb=41
encsw=21

# Two buttons, also on the board, straight to GND with no resistors. IO3 and IO46 are the
# only two pins left that can take one: IO35/36/37 are the octal PSRAM on any R8 part, IO45
# is the flash-voltage strapping pin and a pull-up there means 1.8 V and no boot, IO19/20
# are USB D-/D+, IO0 is BOOT. These two are strapping pins as well - JTAG source select and
# ROM message printing - but neither stops the chip booting whichever way it is left, and
# both do internal pull-ups (this SoC has no input-only pins and IO46 has an ordinary
# IO_MUX register).
btn1pin=3
btn2pin=46
# Back and Enter, not the _base defaults. Those are Next (+) and Prev (-), which is exactly
# what the encoder already does by turning; on a board that has both, two buttons repeating
# the knob are two wasted buttons. Turn to move, press the knob or button 2 to go in,
# button 1 to come back out.
btn1act=2
btn2act=1

# Five pixel ports: data pins are fixed in copper, all disabled until one is turned on.
# Chip default is WS2815 (12 V) rather than WS2812B, because the rail is 12/24 V and the
# current budget strongly favours it: ~5.7 mA per channel against ~20 for 5 V strip.
# Universes chain 0..4 for the default one-universe-per-port count, so filling ports in
# order already gives a valid plan with no arithmetic.
p0_pin=38
p0_uni=0
p0_machan=570
p1_pin=39
p1_uni=1
p1_machan=570
p2_pin=40
p2_uni=2
p2_machan=570
p3_pin=47
p3_uni=3
p3_machan=570
p4_pin=48
p4_uni=4
p4_machan=570

# Pixel driver: force the parallel LCD_CAM path on this board rather than letting the automatic
# rule pick. That rule only asks how many ports fit, and up to three fit in RMT -- but an RMT
# lane that does not get a DMA channel is refilled from an ISR, and under load (Ethernet, web
# UI, DMX) a late refill stretches whichever bit it was clocking. The glitch lands at fixed
# offsets in the stream, so the SAME few LEDs blink every frame. Measured on this board with a
# 47-pixel ring. LCD_CAM is pure GDMA and has no refill at all; the 72-bytes-per-pixel expanded
# frame it wants is nothing on an N16R8's 8 MB of PSRAM.
pixbk=2
