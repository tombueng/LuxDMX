# Base template — global defaults shared by every board, applied before the
# board template. Only values that differ from the schema's NEUTRAL (a pin -> -1,
# an int/enum -> its min, bool -> false, string -> "") need listing here, so this
# mirrors main.cpp's old global DEF_* fallbacks (the per-board -D overrides live
# in each board template). Keys are exactly the schema keys (see config_schema.cpp);
# per-output keys are o<i>_<suffix>. Lines are key=value; '#' is a comment.

# Identity
hostname=dmx-gateway
otapw=dmxota
protocol=2

# Status LED — classic default GPIO2 plain (boards override)
ledpin=2
ledtype=1

# 5-LED panel per-colour brightness (0-255 PWM duty). Full by default; a board with
# the panel (ledtype 3) dims the perceptually-brighter LEDs (green/white) to match.
ledbrr=255
ledbrg=255
ledbry=255
ledbrb=255
ledbrw=255

# Display I2C default pins (boards override)
dispsda=21
dispscl=22

# W5500 SPI default pins (classic-ESP32 VSPI); the LuxDMX board overrides these
ethcs=5
ethsck=18
ethmosi=23
ethmiso=19
ethint=4
ethrst=25
ethfreq=20

# RMII (LAN8720) defaults; only the WT32-ETH01 board actually uses RMII
rmiiaddr=1
rmiimdc=23
rmiimdio=18
rmiipwr=16

# Network
subnet=255.255.255.0

# RDM over Art-Net on by default (only active on an RDM-capable output)
artrdm=1

# On-unit controls (rotary encoder + buttons + display menu, issue #24). All pins
# stay off (-1) so nothing runs unless wired. These are just the sensible knob +
# button-role defaults, so once you set the pins in /config the menu already makes
# sense: standard 4-edge detented encoder, buttons pre-mapped Next/Prev/Enter/Back,
# universe knob spans 0..15 (the common single-net range).
encsteps=4
ctlunimax=15
btn1act=3
btn2act=4
btn3act=1
btn4act=2

# Output 0 on by default at the classic DMX pins; outputs 1 and 2 present but off.
# o2_port must be 3: the neutral value a missing key falls back to is the field's min (1),
# which on a board that never set it would read as "same UART port as output 0".
o0_en=1
o0_tx=17
o0_rx=16
o1_uni=1
o1_port=2
o2_uni=2
o2_port=3

# Pixel ports. All off, no pins, so nothing is allocated on a board that has none.
# The per-port values that must NOT default to their schema minimum are set here:
# a strip with brightness 0, gamma 0 and a WS2812 preset of 0 mA would be silently
# black and report no power draw at all.
#   bright  255  full
#   machan  2000 = 20.00 mA per channel at 255 (WS2812B at 5 V; 60 mA/px all-on)
#   quiesma  100 =  1.00 mA per pixel idle (the controller IC draws this at black)
#   gamma    220 = 2.2, the usual perceptual curve
#   count    170 one universe's worth, so enabling a port does something sensible
p0_bright=255
p0_machan=2000
p0_quiesma=100
p0_gamma=220
p0_count=170
p1_bright=255
p1_machan=2000
p1_quiesma=100
p1_gamma=220
p1_count=170
p2_bright=255
p2_machan=2000
p2_quiesma=100
p2_gamma=220
p2_count=170
p3_bright=255
p3_machan=2000
p3_quiesma=100
p3_gamma=220
p3_count=170
p4_bright=255
p4_machan=2000
p4_quiesma=100
p4_gamma=220
p4_count=170

# Board pixel-rail rating. The conservative 2-layer carrier figure; a 4-layer build
# sets 15400 in its own template or in /config.
railma=9200
# 0 = automatisch. Erzwingen nur, wenn die automatische Wahl nicht passt, siehe docs/pixels.md
pixbk=0
