; RP2350 (Pimoroni Pico Plus 2 W) precise DMX/RDM fixture-responder.
; A cycle-accurate RDM responder built on the RP2350 PIO, used to test the
; LuxDMX ESP32-S3 RDM controller: it answers discovery + GET/SET with exact
; (and, on demand, deliberately mangled) break / MAB / turnaround / baud timing,
; and captures the controller's on-wire RDM timing into PSRAM.
[env:pico_plus_2w]
platform      = raspberrypi
board         = pimoroni_pico_plus_2w
framework     = arduino
monitor_speed = 115200
; CYW43 WiFi country = DE. Default CYW43_COUNTRY_WORLDWIDE fails to associate on EU APs
; (channels/regulatory). 0x4544 == CYW43_COUNTRY('D','E',0).
build_flags   = -DWIFICC=0x4544
lib_deps      = https://github.com/jostlowe/Pico-DMX.git
