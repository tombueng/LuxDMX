name: Build & Release

on:
  push:
    branches: [master]
    # Only rebuild/release when something that actually ends up in the firmware
    # changes. Commits to hardware/, docs/, web/, README, etc. no longer bump the
    # version, so devices on auto-update stop getting spammed with identical builds.
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'extra_scripts.py'
      - '.github/workflows/build.yml'
  pull_request:
    # Build-only verification on PRs (no release — see the `if:` guards on the
    # release steps). Lets a v3/toolchain change be proven green before it ever
    # touches the rolling `latest` release that devices auto-update from.
    branches: [master]
    paths:
      - 'src/**'
      - 'platformio.ini'
      - 'extra_scripts.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:   # allow a manual rebuild/release from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so we can diff against the previous version

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: |
          # pioarduino 55.03.39's Xtensa toolchain archive carries a stray top-level
          # package.json that aborts idf_tools.py (do_strip_container_dirs:
          # "expected 1 entry, got ['package.json', ...]"), leaving the compiler
          # uninstalled. Patch the install-time idf_tools.py to ignore that file.
          # tool-esp_install is downloaded *before* it runs the strip, so if the
          # first build aborts on it we patch the now-present file and retry.
          patch_idf_tools() {
            while IFS= read -r f; do
              sed -i "s|^\([[:space:]]*\)contents = os\.listdir(base_path)\$|\1contents = [c for c in os.listdir(base_path) if c != 'package.json']|" "$f"
              echo "patched $f"
            done < <(find ~/.platformio -path '*tool-esp_install*idf_tools.py' 2>/dev/null)
          }
          patch_idf_tools   # no-op if tool-esp_install isn't downloaded yet

          pio run -e esp32dev || { patch_idf_tools; pio run -e esp32dev; }
          cp .pio/build/esp32dev/firmware.bin   firmware.bin
          cp .pio/build/esp32dev/bootloader.bin bootloader.bin
          cp .pio/build/esp32dev/partitions.bin partitions.bin
          # Gzip the ELF (debug symbols) right away: a later full-source build can
          # evict .pio/build/esp32dev to free runner disk, so don't defer it (#34).
          gzip -c .pio/build/esp32dev/firmware.elf > firmware.elf.gz

          pio run -e esp32s3dev
          cp .pio/build/esp32s3dev/firmware.bin   firmware-esp32s3.bin
          cp .pio/build/esp32s3dev/bootloader.bin bootloader-esp32s3.bin
          cp .pio/build/esp32s3dev/partitions.bin partitions-esp32s3.bin
          gzip -c .pio/build/esp32s3dev/firmware.elf > firmware-esp32s3.elf.gz

          pio run -e wt32eth01
          cp .pio/build/wt32eth01/firmware.bin   firmware-wt32eth01.bin
          cp .pio/build/wt32eth01/bootloader.bin bootloader-wt32eth01.bin
          cp .pio/build/wt32eth01/partitions.bin partitions-wt32eth01.bin
          gzip -c .pio/build/wt32eth01/firmware.elf > firmware-wt32eth01.elf.gz

          # ESP32-S3 with PSRAM (N8R8 / N16R8). Its own from-source core (different sdkconfig
          # from esp32s3dev), so free the already-copied build dirs first to keep runner disk.
          rm -rf .pio/build/esp32dev .pio/build/wt32eth01 .pio/build/esp32s3dev
          pio run -e esp32s3_psram
          cp .pio/build/esp32s3_psram/firmware.bin   firmware-esp32s3-psram.bin
          cp .pio/build/esp32s3_psram/bootloader.bin bootloader-esp32s3-psram.bin
          cp .pio/build/esp32s3_psram/partitions.bin partitions-esp32s3-psram.bin
          gzip -c .pio/build/esp32s3_psram/firmware.elf > firmware-esp32s3-psram.elf.gz

          BOOT_APP0=$(find ~/.platformio/packages -name "boot_app0.bin" | head -1)
          cp "$BOOT_APP0" boot_app0.bin
          echo "1.0.${{ github.run_number }}" > version.txt
        env:
          LUXDMX_VERSION: "1.0.${{ github.run_number }}"

      # Make every build (incl. PRs) downloadable so a branch can be flashed and
      # checked on real hardware before it ever merges + auto-releases to OTA.
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-1.0.${{ github.run_number }}
          path: |
            firmware.bin
            bootloader.bin
            partitions.bin
            firmware-esp32s3.bin
            bootloader-esp32s3.bin
            partitions-esp32s3.bin
            firmware-wt32eth01.bin
            bootloader-wt32eth01.bin
            partitions-wt32eth01.bin
            firmware-esp32s3-psram.bin
            bootloader-esp32s3-psram.bin
            partitions-esp32s3-psram.bin
            boot_app0.bin
            version.txt
          if-no-files-found: error

      - name: Build per-version changelog
        run: |
          # Commits introduced since the previous version tag (meaningful only)
          PREV_TAG=$(git tag -l 'v1.0.*' | sort -V | tail -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "Diffing against $PREV_TAG"
          else
            RANGE="HEAD"
          fi
          git log --pretty=format:"- %s" --no-merges $RANGE \
            | grep -viE "^- (merge|wip\b|fixup|amend|typo|formatting|whitespace)" \
            > changes.txt || true
          # Fallback if empty (e.g. first release or only filtered commits)
          if [ ! -s changes.txt ]; then
            git log --pretty=format:"- %s" --no-merges -10 > changes.txt
          fi
          echo "----- changes.txt -----"; cat changes.txt

      - name: Compose release notes
        run: |
          {
            echo "## What's new in v1.0.${{ github.run_number }}"
            echo ""
            cat changes.txt
            echo ""
            echo ""
            echo "## Flash files"
            echo "- **ESP32** (WROOM-32, WROVER): \`firmware.bin\` + \`flash.ps1\`"
            echo "- **ESP32-S3** (DevKitC-1): \`firmware-esp32s3.bin\`"
            echo "- **ESP32-S3 with PSRAM** (WROOM-1-N8R8 / N16R8): \`firmware-esp32s3-psram.bin\`"
            echo "- **WT32-ETH01** (Ethernet): \`firmware-wt32eth01.bin\`"
            echo ""
            echo "Debug symbols (decode a panic): \`firmware*.elf.gz\` — \`gunzip\` it, then \`xtensa-esp32-elf-addr2line -pfiaC -e firmware.elf 0x...\`"
            echo ""
            echo "_Build 1.0.${{ github.run_number }} from ${{ github.sha }}_"
          } > notes.md

      # Prove we can publish version.txt BEFORE anything is released.
      # version.txt has to go out LAST (it must never advertise binaries that aren't live yet),
      # but that means a failure there would leave a release that no device ever hears about:
      # the bits are live, version.txt still names the old build, every device thinks it is up to
      # date. Silent and easy to miss. So test the write path up front, while failing is still
      # free -- that catches the realistic causes (bad/expired key, host down, path gone).
      # A failure between here and the real upload is still possible, just not the likely one.
      - name: Preflight - can we write to luxdmx.org?
        if: github.ref == 'refs/heads/master'
        env:
          SSH_KEY:  ${{ secrets.LUXDMX_SSH_KEY }}
          SSH_HOST: ${{ secrets.LUXDMX_SSH_HOST }}
          SSH_USER: ${{ secrets.LUXDMX_SSH_USER }}
          SSH_PORT: ${{ secrets.LUXDMX_SSH_PORT }}
        run: |
          umask 077
          # printf '%s\n', NOT '%s'. `gh secret set` strips the trailing newline off stdin, and
          # OpenSSH rejects a private key whose END marker is not newline-terminated:
          # "Load key: error in libcrypto" -- which reads like a wrong key and is not.
          # Reproduced against ssh-keygen -y: no trailing newline fails, one or more is fine.
          printf '%s\n' "$SSH_KEY" > key
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "preflight-${{ github.run_number }}" > preflight.txt
          sftp -i key -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<'SFTP'
          -mkdir /luxdmx.org/firmware
          put preflight.txt /luxdmx.org/firmware/preflight.txt
          SFTP
          # It must be readable over plain HTTP too -- that is how the device fetches it.
          GOT=$(curl -fsS --max-time 20 http://luxdmx.org/firmware/preflight.txt | tr -d '[:space:]')
          [ "$GOT" = "preflight-${{ github.run_number }}" ] \
            || { echo "::error::preflight readback got '$GOT'"; exit 1; }
          sftp -i key -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<'SFTP'
          -rm /luxdmx.org/firmware/preflight.txt
          SFTP
          rm -f key preflight.txt
          echo "write path to luxdmx.org verified"

      - name: Publish preserved versioned release
        if: github.ref == 'refs/heads/master'   # never release from a PR/branch build
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            --title "v1.0.${{ github.run_number }} ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --prerelease \
            firmware.bin bootloader.bin partitions.bin boot_app0.bin \
            firmware-esp32s3.bin bootloader-esp32s3.bin partitions-esp32s3.bin \
            firmware-wt32eth01.bin bootloader-wt32eth01.bin partitions-wt32eth01.bin \
            firmware-esp32s3-psram.bin bootloader-esp32s3-psram.bin partitions-esp32s3-psram.bin \
            firmware.elf.gz firmware-esp32s3.elf.gz firmware-wt32eth01.elf.gz firmware-esp32s3-psram.elf.gz \
            version.txt changes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update rolling 'latest' release
        if: github.ref == 'refs/heads/master'   # never touch the OTA 'latest' from a PR/branch build
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Latest → v1.0.${{ github.run_number }} ($(date -u '+%Y-%m-%d %H:%M UTC'))" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --prerelease \
            firmware.bin bootloader.bin partitions.bin boot_app0.bin \
            firmware-esp32s3.bin bootloader-esp32s3.bin partitions-esp32s3.bin \
            firmware-wt32eth01.bin bootloader-wt32eth01.bin partitions-wt32eth01.bin \
            firmware-esp32s3-psram.bin bootloader-esp32s3-psram.bin partitions-esp32s3-psram.bin \
            version.txt changes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # MUST run AFTER the rolling 'latest' release above. version.txt is what tells a device
      # "a newer build exists"; it must never advertise a version whose binaries aren't
      # downloadable yet. Published first, a device could read 1.0.N, pull /firmware/ota/latest/
      # while that still held 1.0.N-1, flash the OLD image, boot, see 1.0.N again -> update loop
      # (only stopped by the otatries budget). Advertise last, once the bits are actually live.
      - name: Publish version.txt to luxdmx.org (the device's plain-HTTP version endpoint)
        if: github.ref == 'refs/heads/master'
        env:
          SSH_KEY:  ${{ secrets.LUXDMX_SSH_KEY }}
          SSH_HOST: ${{ secrets.LUXDMX_SSH_HOST }}
          SSH_USER: ${{ secrets.LUXDMX_SSH_USER }}
          SSH_PORT: ${{ secrets.LUXDMX_SSH_PORT }}
        run: |
          # The firmware checks http://luxdmx.org/firmware/version.txt over PLAIN HTTP. It used to
          # fetch the GitHub redirect over TLS, but a TLS handshake wants ~40KB of *contiguous*
          # heap, which a fully-booted gateway does not have -- the check skipped itself and then
          # claimed "up to date". This is a real file on the webspace, served without any rewrite
          # (the ^firmware/version/?$ redirect is anchored and does not match .txt, so it stays
          # pointed at GitHub for older firmware in the field).
          #
          # Failing here fails the build on purpose: a stale version.txt tells every device it is
          # up to date and silently stops all updates. Better a red build than a mute fleet.
          umask 077
          # printf '%s\n', NOT '%s'. `gh secret set` strips the trailing newline off stdin, and
          # OpenSSH rejects a private key whose END marker is not newline-terminated:
          # "Load key: error in libcrypto" -- which reads like a wrong key and is not.
          # Reproduced against ssh-keygen -y: no trailing newline fails, one or more is fine.
          printf '%s\n' "$SSH_KEY" > key
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sftp -i key -P "${SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" <<'SFTP'
          -mkdir /luxdmx.org/firmware
          put version.txt /luxdmx.org/firmware/version.txt
          SFTP
          rm -f key
          # Prove it is live and matches this build, rather than trusting the upload.
          sleep 2
          GOT=$(curl -fsS --max-time 20 http://luxdmx.org/firmware/version.txt | tr -d '[:space:]')
          WANT="1.0.${{ github.run_number }}"
          echo "live=$GOT want=$WANT"
          [ "$GOT" = "$WANT" ] || { echo "::error::luxdmx.org/firmware/version.txt says '$GOT', expected '$WANT'"; exit 1; }
