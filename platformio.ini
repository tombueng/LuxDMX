; LuxDMX — Art-Net / sACN → DMX Gateway
; Supports ESP32 (original), ESP32-S3, WT32-ETH01 (RMII Ethernet) and the
; LuxDMX v6 board (ESP32-S3 + W5500 SPI-Ethernet + 5 status LEDs).

; ── Shared settings ─────────────────────────────────────────────────────────
; arduino-esp32 v3 (IDF 5.x) via the pioarduino platform fork. v3 is required for
; the W5500 SPI-Ethernet path (ETH_PHY_W5500 — registers the W5500 as an lwIP
; netif, so AsyncWebServer / Art-Net / OTA keep working unchanged). The original
; PlatformIO espressif32 platform stalled at arduino-esp32 v2.x, which has no
; W5500 ETH support. Pinned for reproducible CI; bump the tag to upgrade.
[env]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Upload — boards without reliable auto-reset: hold BOOT while plugging USB
upload_port  = COM3
upload_flags = --before=no_reset

extra_scripts = extra_scripts.py

lib_deps =
    someweisguy/esp_dmx @ ^4.1.0
    rstephan/ArtnetWifi  @ ^1.5.0
    adafruit/Adafruit NeoPixel @ ^1.12.3
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit SH110X @ ^2.1.12
    adafruit/Adafruit SSD1351 library @ ^1.3.2
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

board_build.partitions = min_spiffs.csv

; AsyncTCP hardening — larger task stack + queue so the web/WebSocket server
; never starves or overflows under sustained connection churn (it must stay
; reachable on stage). Pin it to core 0 (with the WiFi/lwIP stack) so it does
; NOT preempt the Arduino loop()/RDM bus service that lives on core 1.
; Measured on the HIL bench: with AsyncTCP on core 1 at prio 10 it preempts
; loop(), inflating the RDM controller TX->RX turnaround 3-4x under HTTP load
; (median 15->53us, max 126us). Moving it to core 0 isolates the RDM timing;
; web responsiveness under heavy WiFi is lwIP-bound (core 0) either way.
build_flags =
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    ; The EmbeddedConfig library (lib/EmbeddedConfig) is generic; the consumer
    ; provides config_schema.h + config_enums.h in include/. Put that dir on the
    ; global include path so the library's .cpp can see them when built in isolation.
    -Iinclude

; ── ESP32 (original / WROOM-32 / WROVER) ────────────────────────────────────
; Default LED: GPIO2 plain, type 1 (plain GPIO active-high)
[env:esp32dev]
board        = esp32dev
upload_speed = 460800
; USE_ETH_SPI compiles in the W5500 driver so a DIY user can add an off-the-shelf
; W5500 module at runtime — pins are set in /config (defaults = classic-ESP32 VSPI:
; CS=5 SCK=18 MOSI=23 MISO=19 INT=4 RST=25). WiFi + W5500 in one image, picked in
; /config (cfg.useEthernet). No dedicated W5500 build env needed any more.
; Per-board default VALUES now live in templates/esp32dev.ini (selected by
; DEFAULT_TEMPLATE), not in -D macros. Only true compile-time flags stay here.
build_flags  = ${env.build_flags} -DUSE_ETH_SPI -DDEFAULT_TEMPLATE=esp32dev -DDMX_RMT

; ── ESP32-S3 (DevKitC-1) ────────────────────────────────────────────────────
; DevKitC-1 built-in LED: GPIO48 WS2812 RGB, type 2
; Other S3 boards (FeatherS3, XIAO): plain LED on GPIO21 — change DEF_LED_PIN
[env:esp32s3dev]
board        = esp32-s3-devkitc-1
upload_speed = 921600
; Disable the IDF brownout detector — the S3 boot-loop fix. On
; arduino-esp32 v3 / IDF 5 the BOD is armed in IDF startup (do_core_init →
; esp_brownout_init) BEFORE setup() runs, so the runtime RTC_CNTL_BROWN_OUT_REG
; write is too late on the S3 and the board boot-loops. Required before v3 ships
; to esp32s3dev OTA users. NOTE: custom_sdkconfig forces an Arduino source build.
custom_sdkconfig =
    CONFIG_ESP_BROWNOUT_DET=n
; The from-source build (forced by custom_sdkconfig) refetches managed components
; fresh, and arduino-esp32 pins esp-modbus at "^2.1.2" (a caret range), so it pulls
; whatever 2.x is newest. A release after v1.0.126 ships Kconfig defaults that fail
; esp-modbus's own static_assert (FMB_MASTER_MAX_API_BLOCKING_TIME_MS must be >=
; FMB_MASTER_TIMEOUT_MS_RESPOND) and broke the S3 build. We don't use Modbus, so
; drop the unused component instead of chasing its config.
custom_component_remove = espressif/esp-modbus
build_flags  = ${env.build_flags} -DUSE_ETH_SPI -DDEFAULT_TEMPLATE=esp32s3dev -DDMX_RMT

; (Removed the esp32s3dev_fast env: the precompiled build leaves the IDF brownout
; detector ON, which boot-loops a real S3. Always build the S3 from source via
; esp32s3dev — CONFIG_ESP_BROWNOUT_DET=n — so it boots on actual hardware.)

; ── WT32-ETH01 (RMII Ethernet + WiFi, runtime-selectable — issue #14) ─────────
; LAN8720 PHY on RMII — GPIO16=PHY power, GPIO0=CLK, GPIO18=MDIO, GPIO23=MDC
; DMX moved to GPIO4(TX)/GPIO5(RX) because GPIO16 is taken by LAN8720.
; USE_ETH_RMII compiles BOTH the wired (LAN8720) and WiFi stacks into one build;
; the active interface is chosen at runtime in /config (cfg.useEthernet). Wired
; Ethernet stays the DEFAULT here (this board has historically been wired-only),
; with WiFi STA/AP and an Ethernet→AP no-link fallback available as options.
[env:wt32eth01]
board        = wt32-eth01
upload_speed = 460800
build_flags  =
    ${env.build_flags}
    -DUSE_ETH_RMII
    -DDEFAULT_TEMPLATE=wt32eth01
    -DDMX_RMT

; ── LuxDMX v6 board — NO dedicated env (it IS the esp32s3dev build) ──────────
; The v6 is just an ESP32-S3 + W5500 with a fixed pin map; it needs no separate
; firmware. The released `esp32s3dev` build (which already sets -DUSE_ETH_SPI -DDMX_RMT)
; runs it. A v6 owner flashes that build and, in /config, picks the "LuxDMX v6" board
; template — that fills the tested pin map (LEDs, DMX, W5500 SPI, display, panel
; brightness). Descriptor + preset live in web/boards/luxdmx_v6.json (mirrored into the
; built-in board list in src/pages/config.html); the canonical values also live in
; templates/luxdmx_v6.ini (the native config test's target).
;   W5500 SPI : SCLK=12 MOSI=11 MISO=13 CS=10 INT=14 RST=9   (host SPI3)
;   DMX       : DI/TX=17  RO/RX=18  DE+/RE=8 (RTS/enable)  (+ out B: 16/21/47)
;   LEDs (5)  : R=1  G=2  Y=6  B=7  W=15  (discrete GPIO → ledType 3)
;   Display J4: I2C SDA=4 SCL=5  (optional OLED; SPI panel pins set in /config)
; Source-build escape hatch: for a firmware that boots straight into the v6 defaults
; (and reports board "luxdmx_v6", enabling the copper-pin locks in the picker), build
; esp32s3dev with the extra flags -DBOARD_LUXDMX_V6 -DDEFAULT_TEMPLATE=luxdmx_v6.
; (The old env's CONFIG_LWIP_TCPIP_TASK_AFFINITY_* lines are dropped — RDM/docs/FINDINGS.md
; measured them as a no-op: arduino-esp32 already pins lwIP to core 0.)

; ── ESP32-S3 with PSRAM (WROOM-1-N16R8 / N8R8, octal PSRAM) ─────────────────
; Enthusiast build: enables the 8 MB octal PSRAM so the RDM tables and the
; WiFi/lwIP buffers live in external RAM, leaving the internal heap wide open.
; Same generic S3 target as esp32s3dev (no W5500 assumption). Still boots on a
; non-PSRAM S3 (SPIRAM_IGNORE_NOTFOUND) -- it just won't use PSRAM there.
[env:esp32s3_psram]
board        = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
upload_speed = 921600
custom_sdkconfig =
    CONFIG_ESP_BROWNOUT_DET=n
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_IGNORE_NOTFOUND=y
custom_component_remove = espressif/esp-modbus
build_flags  = ${env.build_flags} -DUSE_ETH_SPI -DDEFAULT_TEMPLATE=esp32s3dev -DDMX_RMT

; ── Arduino OTA (after first USB flash) ─────────────────────────────────────
; upload_protocol = espota
; upload_port     = dmx-gateway.local
; upload_flags    = --auth=dmxota
